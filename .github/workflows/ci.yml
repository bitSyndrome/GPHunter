name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22.6+ is required: every test script, `server start` and dev.sh
      # run TypeScript directly via --experimental-strip-types.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs all workspaces: shared + server + cli.
      - name: Test
        run: npm test

      # Also covers the esbuild agent bundle that the server hands out at
      # /api/v1/agent/ghost-hunter.cjs — the default install path.
      - name: Build
        run: npm run build
